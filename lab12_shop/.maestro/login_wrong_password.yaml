# Сценарій: неправильний пароль
appId: ua.vtfk.lab12_shop
---
- launchApp:
    clearState: true
- tapOn:
    id: "email_field"
- inputText: "andrii@vtfk.ua"
- tapOn:
    id: "password_field"
- inputText: "wrong-pass"
- hideKeyboard
- tapOn:
    id: "login_button"
- assertVisible: "Невірний email або пароль"
- assertNotVisible: "Каталог"
