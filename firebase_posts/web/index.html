<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Студентські записи на Firebase">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="firebase_posts">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Firebase Posts</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // модуль storage підключаю сам, а не через FlutterFire, див. нижче
    window.flutterfire_ignore_scripts = ['storage'];
  </script>
  <script type="module">
    // Хмарний Storage тепер тільки на тарифі Blaze, тому фото йдуть в емулятор.
    // SDK підключається до емулятора по http, а сторінка в Codespaces відкрита
    // по https, і браузер такі запити блокує. Тому після підключення
    // перемикаю протокол на https і прибираю порт з адреси.
    const m = await import('https://www.gstatic.com/firebasejs/13.3.0/firebase-storage.js');
    window.firebase_storage = {
      ...m,
      connectStorageEmulator(storage, host, port, options) {
        m.connectStorageEmulator(storage, host, port, options);
        if (location.protocol === 'https:') {
          storage._protocol = 'https';
          storage.host = host;
        }
      },
    };
    // Flutter запускаю тільки тепер, коли firebase_storage вже готовий
    const s = document.createElement('script');
    s.src = 'flutter_bootstrap.js';
    document.body.append(s);
  </script>
</body>
</html>
